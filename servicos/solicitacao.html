<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Folha A4 com solicitações de serviços para preenchimento manual.">
    <meta name="theme-color" content="#08a6d8">
    <title>Asscontal - Solicitação de Serviços</title>
    <link rel="icon" type="image/png" sizes="128x128" href="/images/fundo-azul-128x128.png">
    <link rel="apple-touch-icon" href="/images/fundo-azul-128x128.png">
    <link rel="stylesheet" href="/servicos/style-solicitacao.css?v=3">
    <script src="/servicos/solicitacao.js?v=3" defer></script>
</head>
<body>
    <header class="screen-toolbar">
        <div class="toolbar-content">
            <div>
                <p class="eyebrow">Asscontal Assessoria Contábil</p>
                <h1>Solicitações de Serviços</h1>
                <p>Folha A4 com seis solicitações para preenchimento manual.</p>
            </div>
            <button id="printButton" type="button">Imprimir folha A4</button>
        </div>
    </header>

    <main class="preview-area">
        <section id="requestGrid" class="a4-sheet" aria-label="Folha A4 com seis solicitações"></section>
        <p class="print-tip">Na janela de impressão, selecione papel A4, escala 100% e desative cabeçalhos e rodapés.</p>
    </main>

    <template id="slipTemplate">
        <article class="request-slip">
            <header class="slip-header">
                <img src="/images/logo-2019-190x105.png" alt="Asscontal Assessoria Contábil">
                <div><span>Formulário interno</span><h2>Solicitação de Serviços</h2></div>
            </header>
            <div class="recipient-line"><strong>Para:</strong><span></span></div>
            <div class="writing-area" aria-label="Espaço para descrição"></div>
            <footer class="slip-footer">
                <div class="requester-line"><strong>Solicitante:</strong><span></span></div>
                <div class="date-line"><strong>Data:</strong><span></span><b>/</b><span></span><b>/</b><span class="year"></span></div>
            </footer>
        </article>
    </template>
</body>
</html>

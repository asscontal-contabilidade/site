<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Calculadora DIFAL ES - Asscontal</title>

    <style>
        /* Padronização entre Chrome, Edge, Firefox e Safari */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background-color: #f8fafc;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;
            color: #1e293b;
            background-color: #f8fafc;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .calculator-container {
            width: 100%;
            max-width: 650px;
            margin: auto 0;

            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);

            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .logo-section {
            width: 100%;
            padding: 30px 20px 10px;
            text-align: center;
            background-color: #fcfcfc;
        }

        .logo-section img {
            display: block;
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 105px;
            margin: 0 auto;
            object-fit: contain;
        }

        .logo-section h1 {
            margin: 15px 0 0;
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
        }

        .controls-section {
            width: 100%;
            padding: 20px 30px 30px;
            border-bottom: 1px solid #e2e8f0;
            background-color: #fcfcfc;

            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 20px;
        }

        .form-group {
            flex: 1 1 170px;
            min-width: 0;

            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
        }

        .form-group input,
        .form-group select {
            display: block;
            width: 100%;
            min-width: 0;
            height: 46px;
            padding: 10px 14px;

            color: #1e293b;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;

            font-size: 16px;
            line-height: 1.2;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input {
            text-align: right;
        }

        .form-group select {
            text-align: left;
            cursor: pointer;

            /* Melhora a consistência em Safari e Firefox */
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;

            padding-right: 42px;

            background-image:
                linear-gradient(45deg, transparent 50%, #64748b 50%),
                linear-gradient(135deg, #64748b 50%, transparent 50%);
            background-position:
                calc(100% - 20px) 19px,
                calc(100% - 14px) 19px;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
        }

        .form-group input:hover,
        .form-group select:hover {
            border-color: #94a3b8;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Remove setas do campo numérico no Chrome, Edge e Safari */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        /* Remove setas do campo numérico no Firefox */
        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .result-section {
            width: 100%;
            padding: 30px;

            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .table-header {
            width: 100%;
            padding: 16px;

            color: #334155;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-bottom: 0;
            border-radius: 12px 12px 0 0;

            text-align: center;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.25;
        }

        .table-container {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            border-radius: 0 0 12px 12px;

            /* Rolagem mais suave em iPhone/iPad */
            -webkit-overflow-scrolling: touch;
        }

        .difal-table {
            width: 100%;
            min-width: 430px;

            border-collapse: collapse;
            table-layout: fixed;

            text-align: center;
            font-size: 20px;
        }

        .difal-table td {
            width: 33.333%;
            padding: 16px 8px;

            color: #1e293b;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;

            vertical-align: middle;
            white-space: nowrap;
        }

        .bg-green {
            color: #ffffff !important;
            background-color: #22c55e !important;
            font-weight: 600;
        }

        .bg-red {
            color: #fef08a !important;
            background-color: #ef4444 !important;
            font-weight: 700;
        }

        .bg-yellow {
            color: #b91c1c !important;
            background-color: #fde047 !important;
            font-size: 22px;
            font-weight: 700;
        }

        .bg-gray {
            color: #475569 !important;
            background-color: #f8fafc !important;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .calculator-container {
                margin: 0;
                border-radius: 12px;
            }

            .logo-section {
                padding: 22px 15px 8px;
            }

            .logo-section img {
                max-height: 90px;
            }

            .logo-section h1 {
                font-size: 20px;
            }

            .controls-section {
                padding: 18px 15px 20px;
                gap: 15px;
            }

            .form-group {
                flex-basis: 100%;
            }

            .result-section {
                padding: 20px 15px;
            }

            .table-header {
                padding: 12px;
                font-size: 20px;
            }

            .difal-table {
                font-size: 16px;
            }

            .difal-table td {
                padding: 12px 6px;
            }

            .bg-yellow {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .difal-table {
                min-width: 390px;
            }
        }
    </style>
</head>

<body>
    <main class="calculator-container">
        <header class="logo-section">
            <img
                src="https://asscontal.com.br/images/logo-2019-190x105.png"
                alt="Logomarca Asscontal"
                width="190"
                height="105"
            >

            <h1>Calculadora DIFAL</h1>
        </header>

        <section class="controls-section" aria-label="Dados para cálculo">
            <div class="form-group">
                <label for="valorOp">Valor da Operação (R$)</label>

                <input
                    type="text"
                    id="valorOp"
                    value="990,00"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-describedby="valorOpAjuda"
                >
            </div>

            <div class="form-group">
                <label for="aliqInter">Alíquota Interestadual</label>

                <select id="aliqInter">
                    <option value="4">4%</option>
                    <option value="7">7%</option>
                    <option value="12" selected>12%</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aliqIntra">Alíquota Interna ES (%)</label>

                <input
                    type="text"
                    id="aliqIntra"
                    value="17,00"
                    inputmode="decimal"
                    autocomplete="off"
                >
            </div>
        </section>

        <section class="result-section" aria-live="polite">
            <div class="table-header" id="tituloTabela">
                DIFAL ES - 12%
            </div>

            <div class="table-container">
                <table class="difal-table" aria-label="Resultado do cálculo DIFAL">
                    <tbody>
                        <tr>
                            <td class="bg-green" id="r1c1">990,00</td>
                            <td class="bg-red" id="r1c2">12,00%</td>
                            <td id="r1c3">118,80</td>
                        </tr>

                        <tr>
                            <td colspan="3" id="r2c1" class="bg-gray">
                                871,20
                            </td>
                        </tr>

                        <tr>
                            <td id="r3c1">871,20</td>
                            <td id="r3c2">0,83</td>
                            <td id="r3c3">1.049,64</td>
                        </tr>

                        <tr>
                            <td id="r4c1">1.049,64</td>
                            <td id="r4c2">17,00%</td>
                            <td id="r4c3">178,44</td>
                        </tr>

                        <tr>
                            <td id="r5c1">178,44</td>
                            <td id="r5c2">118,80</td>
                            <td class="bg-yellow" id="r5c3">59,64</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        (function () {
            "use strict";

            var valorOpInput = document.getElementById("valorOp");
            var aliqInterSelect = document.getElementById("aliqInter");
            var aliqIntraInput = document.getElementById("aliqIntra");

            function parseNumeroBR(valor) {
                if (valor === null || valor === undefined) {
                    return 0;
                }

                var texto = String(valor)
                    .trim()
                    .replace(/\s/g, "")
                    .replace(/\./g, "")
                    .replace(",", ".")
                    .replace(/[^\d.-]/g, "");

                var numero = Number(texto);

                return Number.isFinite(numero) ? numero : 0;
            }

            function formatarBRL(numero) {
                return Number(numero).toLocaleString("pt-BR", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }

            function formatarPercentual(numero) {
                return formatarBRL(numero) + "%";
            }

            function formatarCampoMoeda(elemento) {
                var somenteNumeros = elemento.value.replace(/\D/g, "");

                if (!somenteNumeros) {
                    elemento.value = "";
                    return;
                }

                var numero = Number(somenteNumeros) / 100;
                elemento.value = formatarBRL(numero);
            }

            function calcularDIFAL() {
                var valorOp = parseNumeroBR(valorOpInput.value);
                var aliqInter = Number(aliqInterSelect.value) || 0;
                var aliqIntra = parseNumeroBR(aliqIntraInput.value);

                var fatorDivisor = 1 - (aliqIntra / 100);

                if (
                    valorOp <= 0 ||
                    aliqInter < 0 ||
                    aliqIntra < 0 ||
                    aliqIntra >= 100 ||
                    fatorDivisor <= 0
                ) {
                    return;
                }

                var icmsOrigem = valorOp * (aliqInter / 100);
                var valorSemIcms = valorOp - icmsOrigem;
                var baseCalculoDupla = valorSemIcms / fatorDivisor;
                var icmsDestino = baseCalculoDupla * (aliqIntra / 100);
                var difal = icmsDestino - icmsOrigem;

                document.getElementById("tituloTabela").textContent =
                    "DIFAL ES - " + aliqInter + "%";

                document.getElementById("r1c1").textContent =
                    formatarBRL(valorOp);

                document.getElementById("r1c2").textContent =
                    formatarPercentual(aliqInter);

                document.getElementById("r1c3").textContent =
                    formatarBRL(icmsOrigem);

                document.getElementById("r2c1").textContent =
                    formatarBRL(valorSemIcms);

                document.getElementById("r3c1").textContent =
                    formatarBRL(valorSemIcms);

                document.getElementById("r3c2").textContent =
                    fatorDivisor.toLocaleString("pt-BR", {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });

                document.getElementById("r3c3").textContent =
                    formatarBRL(baseCalculoDupla);

                document.getElementById("r4c1").textContent =
                    formatarBRL(baseCalculoDupla);

                document.getElementById("r4c2").textContent =
                    formatarPercentual(aliqIntra);

                document.getElementById("r4c3").textContent =
                    formatarBRL(icmsDestino);

                document.getElementById("r5c1").textContent =
                    formatarBRL(icmsDestino);

                document.getElementById("r5c2").textContent =
                    formatarBRL(icmsOrigem);

                document.getElementById("r5c3").textContent =
                    formatarBRL(difal);
            }

            valorOpInput.addEventListener("input", function () {
                formatarCampoMoeda(valorOpInput);
                calcularDIFAL();
            });

            aliqInterSelect.addEventListener("change", calcularDIFAL);
            aliqIntraInput.addEventListener("input", calcularDIFAL);
            aliqIntraInput.addEventListener("change", calcularDIFAL);

            calcularDIFAL();
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asscontal Assessoria Contábil - Calculadora de DIFAL ES</title>
    <!-- Fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-focus: #3b82f6;
            
            /* Cores da tabela */
            --cell-green: #22c55e;
            --cell-red: #ef4444;
            --cell-yellow: #fde047;
            --text-yellow: #fef08a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Seção da Logomarca */
        .logo-section {
            width: 100%;
            text-align: center;
            padding: 30px 20px 10px 20px;
            background-color: #fcfcfc;
        }

        .logo-section img {
            max-height: 70px;
            max-width: 100%;
            object-fit: contain;
        }

        /* Seção de Controles */
        .controls-section {
            padding: 20px 30px 30px 30px;
            border-bottom: 1px solid var(--border-color);
            background-color: #fcfcfc;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            text-align: right;
        }
        
        .form-group select {
            text-align: left;
            cursor: pointer;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Seção da Tabela */
        .result-section {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .table-header {
            width: 100%;
            background-color: #f1f5f9;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            color: #334155;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 1.25rem;
            font-variant-numeric: tabular-nums; 
        }

        td {
            border: 1px solid var(--border-color);
            padding: 16px 8px;
            width: 33.33%;
            background-color: #fff;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        /* Estilos de Cor Modernizados */
        .bg-green { 
            background-color: var(--cell-green); 
            color: #fff; 
            font-weight: 600;
        }
        .bg-red { 
            background-color: var(--cell-red); 
            color: var(--text-yellow); 
            font-weight: 700; 
        }
        .bg-yellow { 
            background-color: var(--cell-yellow); 
            color: #b91c1c; 
            font-weight: 700;
            font-size: 1.4rem;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .logo-section {
                padding: 20px 15px 5px 15px;
            }
            .controls-section, .result-section {
                padding: 20px 15px;
            }
            .table-header {
                font-size: 1.25rem;
                padding: 12px;
            }
            table {
                font-size: 1rem;
            }
            td {
                padding: 12px 4px;
            }
            .bg-yellow {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        
        <!-- Área da Logomarca -->
        <div class="logo-section">
            <!-- Para funcionar corretamente, certifique-se de ter um arquivo chamado logo.png na mesma pasta que este HTML -->
            <img src="logo.png" alt="Logomarca Asscontal">
        </div>

        <!-- Controles de Entrada -->
        <div class="controls-section">
            <div class="controls-grid">
                <div class="form-group">
                    <label for="valorOp">Valor da Operação (R$)</label>
                    <input type="text" id="valorOp" value="990,00" inputmode="numeric" oninput="formatarMoeda(this); calcularDIFAL();">
                </div>
                <div class="form-group">
                    <label for="aliqInter">Alíquota Interestadual</label>
                    <select id="aliqInter" onchange="calcularDIFAL()">
                        <option value="4">4%</option>
                        <option value="7">7%</option>
                        <option value="12" selected>12%</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="aliqIntra">Alíq. Interna ES (%)</label>
                    <input type="number" id="aliqIntra" value="17" step="0.1" oninput="calcularDIFAL()">
                </div>
            </div>
        </div>

        <!-- Tabela -->
        <div class="result-section">
            <div class="table-header" id="tituloTabela">DIFAL ES - 12%</div>
            <div class="table-container">
                <table>
                    <tr>
                        <td class="bg-green" id="r1c1">990,00</td>
                        <td class="bg-red" id="r1c2">12,00%</td>
                        <td id="r1c3">118,80</td>
                    </tr>
                    <tr>
                        <td colspan="3" id="r2c1" style="font-weight: 600; color: #475569; background-color: #f8fafc;">871,20</td>
                    </tr>
                    <tr>
                        <td id="r3c1">871,20</td>
                        <td id="r3c2">0,83</td>
                        <td id="r3c3">1.049,64</td>
                    </tr>
                    <tr>
                        <td id="r4c1">1.049,64</td>
                        <td id="r4c2">17,00%</td>
                        <td id="r4c3">178,44</td>
                    </tr>
                    <tr>
                        <td id="r5c1">178,44</td>
                        <td id="r5c2">118,80</td>
                        <td class="bg-yellow" id="r5c3">59,64</td>
                    </tr>
                </table>
            </div>
        </div>

    </div>

    <!-- Script com a Inteligência das Fórmulas -->
    <script>
        function formatarMoeda(elemento) {
            let valor = elemento.value.replace(/\D/g, "");
            valor = (valor / 100).toFixed(2) + "";
            valor = valor.replace(".", ",");
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            elemento.value = valor;
        }

        function parseBRL(val) {
            if (!val) return 0;
            return parseFloat(val.replace(/\./g, "").replace(",", ".")) || 0;
        }

        function formatBRL(num) {
            return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function calcularDIFAL() {
            let valorOp = parseBRL(document.getElementById('valorOp').value);
            let aliqInter = parseFloat(document.getElementById('aliqInter').value) || 0;
            let aliqIntra = parseFloat(document.getElementById('aliqIntra').value) || 0;

            if (valorOp === 0) return;

            let icmsOrigem = valorOp * (aliqInter / 100);
            let valorSemIcms = valorOp - icmsOrigem;
            
            let fatorDivisor = 1 - (aliqIntra / 100);
            let baseCalculoDupla = valorSemIcms / fatorDivisor;
            
            let icmsDestino = baseCalculoDupla * (aliqIntra / 100);
            let difal = icmsDestino - icmsOrigem;

            document.getElementById('tituloTabela').innerText = `DIFAL ES - ${aliqInter}%`;

            document.getElementById('r1c1').innerText = formatBRL(valorOp);
            document.getElementById('r1c2').innerText = formatBRL(aliqInter) + "%";
            document.getElementById('r1c3').innerText = formatBRL(icmsOrigem);

            document.getElementById('r2c1').innerText = formatBRL(valorSemIcms);

            document.getElementById('r3c1').innerText = formatBRL(valorSemIcms);
            document.getElementById('r3c2').innerText = fatorDivisor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('r3c3').innerText = formatBRL(baseCalculoDupla);

            document.getElementById('r4c1').innerText = formatBRL(baseCalculoDupla);
            document.getElementById('r4c2').innerText = formatBRL(aliqIntra) + "%";
            document.getElementById('r4c3').innerText = formatBRL(icmsDestino);

            document.getElementById('r5c1').innerText = formatBRL(icmsDestino);
            document.getElementById('r5c2').innerText = formatBRL(icmsOrigem);
            document.getElementById('r5c3').innerText = formatBRL(difal);
        }

        // Inicia o cálculo automático ao abrir a página
        calcularDIFAL();
    </script>
</body>
</html>

<style>
    .difal-wrapper {
        font-family: 'Inter', Arial, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        display: flex;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
    }

    .calculator-container {
        background-color: #ffffff;
        width: 100%;
        max-width: 650px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .logo-section {
        width: 100%;
        text-align: center;
        padding: 30px 20px 10px 20px;
        background-color: #fcfcfc;
    }

    .logo-section img {
        max-height: 105px;
        max-width: 100%;
        object-fit: contain;
    }

    .logo-section h2 {
        margin-top: 15px;
        font-size: 24px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 0;
    }

    .controls-section {
        padding: 20px 30px 30px 30px;
        border-bottom: 1px solid #e2e8f0;
        background-color: #fcfcfc;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: space-between;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        min-width: 150px;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
    }

    .form-group input, .form-group select {
        padding: 12px 16px;
        font-size: 16px;
        font-family: inherit;
        color: #1e293b;
        background-color: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        outline: none;
        text-align: right;
    }
    
    .form-group select {
        text-align: left;
        cursor: pointer;
    }

    .result-section {
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .table-header {
        width: 100%;
        background-color: #f1f5f9;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        padding: 16px;
        border: 1px solid #e2e8f0;
        border-bottom: none;
        border-radius: 12px 12px 0 0;
        color: #334155;
        box-sizing: border-box;
    }

    .table-container {
        width: 100%;
        overflow-x: auto;
    }

    .difal-table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
        font-size: 20px;
    }

    .difal-table td {
        border: 1px solid #e2e8f0;
        padding: 16px 8px;
        width: 33.33%;
        background-color: #fff;
        color: #1e293b;
    }

    .bg-green { background-color: #22c55e !important; color: #fff !important; font-weight: 600; }
    .bg-red { background-color: #ef4444 !important; color: #fef08a !important; font-weight: 700; }
    .bg-yellow { background-color: #fde047 !important; color: #b91c1c !important; font-weight: 700; font-size: 22px; }
    .bg-gray { background-color: #f8fafc !important; font-weight: 600; color: #475569 !important; }

    @media (max-width: 600px) {
        .logo-section h2 { font-size: 20px; }
        .controls-section, .result-section { padding: 20px 15px; }
        .table-header { font-size: 20px; padding: 12px; }
        .difal-table { font-size: 16px; }
        .difal-table td { padding: 12px 4px; }
        .bg-yellow { font-size: 18px; }
    }
</style>

<div class="difal-wrapper">
    <div class="calculator-container">
        
        <div class="logo-section">
            <img src="https://asscontal.com.br/images/logo-2019-190x105.png" alt="Logomarca Asscontal">
            <h2>Calculadora DIFAL</h2>
        </div>

        <div class="controls-section">
            <div class="form-group">
                <label for="valorOp">Valor da Operação (R$)</label>
                <input type="text" id="valorOp" value="990,00" inputmode="numeric" oninput="formatarMoeda(this); calcularDIFAL();">
            </div>
            <div class="form-group">
                <label for="aliqInter">Alíquota Interestadual</label>
                <select id="aliqInter" onchange="calcularDIFAL()">
                    <option value="4">4%</option>
                    <option value="7">7%</option>
                    <option value="12" selected>12%</option>
                </select>
            </div>
            <div class="form-group">
                <label for="aliqIntra">Alíq. Interna ES (%)</label>
                <input type="number" id="aliqIntra" value="17" step="0.1" oninput="calcularDIFAL()">
            </div>
        </div>

        <div class="result-section">
            <div class="table-header" id="tituloTabela">DIFAL ES - 12%</div>
            <div class="table-container">
                <table class="difal-table">
                    <tr>
                        <td class="bg-green" id="r1c1">990,00</td>
                        <td class="bg-red" id="r1c2">12,00%</td>
                        <td id="r1c3">118,80</td>
                    </tr>
                    <tr>
                        <td colspan="3" id="r2c1" class="bg-gray">871,20</td>
                    </tr>
                    <tr>
                        <td id="r3c1">871,20</td>
                        <td id="r3c2">0,83</td>
                        <td id="r3c3">1.049,64</td>
                    </tr>
                    <tr>
                        <td id="r4c1">1.049,64</td>
                        <td id="r4c2">17,00%</td>
                        <td id="r4c3">178,44</td>
                    </tr>
                    <tr>
                        <td id="r5c1">178,44</td>
                        <td id="r5c2">118,80</td>
                        <td class="bg-yellow" id="r5c3">59,64</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function formatarMoeda(elemento) {
        let valor = elemento.value.replace(/\D/g, "");
        valor = (valor / 100).toFixed(2) + "";
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        elemento.value = valor;
    }

    function parseBRL(val) {
        if (!val) return 0;
        return parseFloat(val.replace(/\./g, "").replace(",", ".")) || 0;
    }

    function formatBRL(num) {
        return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calcularDIFAL() {
        let valorOp = parseBRL(document.getElementById('valorOp').value);
        let aliqInter = parseFloat(document.getElementById('aliqInter').value) || 0;
        let aliqIntra = parseFloat(document.getElementById('aliqIntra').value) || 0;

        if (valorOp === 0) return;

        let icmsOrigem = valorOp * (aliqInter / 100);
        let valorSemIcms = valorOp - icmsOrigem;
        
        let fatorDivisor = 1 - (aliqIntra / 100);
        let baseCalculoDupla = valorSemIcms / fatorDivisor;
        
        let icmsDestino = baseCalculoDupla * (aliqIntra / 100);
        let difal = icmsDestino - icmsOrigem;

        document.getElementById('tituloTabela').innerText = `DIFAL ES - ${aliqInter}%`;

        document.getElementById('r1c1').innerText = formatBRL(valorOp);
        document.getElementById('r1c2').innerText = formatBRL(aliqInter) + "%";
        document.getElementById('r1c3').innerText = formatBRL(icmsOrigem);
        document.getElementById('r2c1').innerText = formatBRL(valorSemIcms);
        document.getElementById('r3c1').innerText = formatBRL(valorSemIcms);
        document.getElementById('r3c2').innerText = fatorDivisor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('r3c3').innerText = formatBRL(baseCalculoDupla);
        document.getElementById('r4c1').innerText = formatBRL(baseCalculoDupla);
        document.getElementById('r4c2').innerText = formatBRL(aliqIntra) + "%";
        document.getElementById('r4c3').innerText = formatBRL(icmsDestino);
        document.getElementById('r5c1').innerText = formatBRL(icmsDestino);
        document.getElementById('r5c2').innerText = formatBRL(icmsOrigem);
        document.getElementById('r5c3').innerText = formatBRL(difal);
    }

    calcularDIFAL();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Calculadora de DIFAL para operações destinadas ao Estado do Espírito Santo."
    >

    <title>Calculadora DIFAL ES - Asscontal</title>

    <link
        rel="stylesheet"
        href="/fiscal/style-difal.css?v=20260902"
    >

    <script
        src="/fiscal/difal.js?v=20260902"
        defer
    ></script>
</head>

<body>
    <main class="calculator-container">
        <header class="logo-section">
            <img
                src="/images/logo-2019-190x105.png"
                alt="Asscontal Assessoria Contábil"
                width="190"
                height="105"
            >

            <h1>Calculadora DIFAL</h1>
        </header>

        <section
            class="controls-section"
            aria-label="Informações para cálculo do DIFAL"
        >
            <div class="form-group">
                <label for="valorOp">
                    Valor da Operação (R$)
                </label>

                <input
                    type="text"
                    id="valorOp"
                    name="valorOp"
                    value="990,00"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Valor da operação em reais"
                >
            </div>

            <div class="form-group">
                <label for="aliqInter">
                    Alíquota Interestadual
                </label>

                <select
                    id="aliqInter"
                    name="aliqInter"
                    aria-label="Alíquota interestadual"
                >
                    <option value="4">4%</option>
                    <option value="7">7%</option>
                    <option value="12" selected>12%</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aliqIntra">
                    Alíquota Interna ES (%)
                </label>

                <input
                    type="text"
                    id="aliqIntra"
                    name="aliqIntra"
                    value="17,00"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Alíquota interna do Espírito Santo"
                >
            </div>
        </section>

        <section
            class="result-section"
            aria-label="Resultado do cálculo do DIFAL"
            aria-live="polite"
        >
            <div
                class="table-header"
                id="tituloTabela"
            >
                DIFAL ES - 12,00%
            </div>

            <div class="table-container">
                <table
                    class="difal-table"
                    aria-label="Memória de cálculo do DIFAL"
                >
                    <tbody>
                        <tr>
                            <td
                                class="bg-green"
                                id="r1c1"
                            >
                                990,00
                            </td>

                            <td
                                class="bg-red"
                                id="r1c2"
                            >
                                12,00%
                            </td>

                            <td id="r1c3">
                                118,80
                            </td>
                        </tr>

                        <tr>
                            <td
                                colspan="3"
                                class="bg-gray"
                                id="r2c1"
                            >
                                871,20
                            </td>
                        </tr>

                        <tr>
                            <td id="r3c1">
                                871,20
                            </td>

                            <td id="r3c2">
                                0,83
                            </td>

                            <td id="r3c3">
                                1.049,64
                            </td>
                        </tr>

                        <tr>
                            <td id="r4c1">
                                1.049,64
                            </td>

                            <td id="r4c2">
                                17,00%
                            </td>

                            <td id="r4c3">
                                178,44
                            </td>
                        </tr>

                        <tr>
                            <td id="r5c1">
                                178,44
                            </td>

                            <td id="r5c2">
                                118,80
                            </td>

                            <td
                                class="bg-yellow"
                                id="r5c3"
                            >
                                59,64
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p
                class="validation-message"
                id="validationMessage"
                role="alert"
                hidden
            ></p>
        </section>

        <footer class="calculator-footer">
            <p>
                Ferramenta de simulação. Confirme os valores antes do
                recolhimento.
            </p>
        </footer>
    </main>

    <noscript>
        <div class="noscript-message">
            Esta calculadora precisa do JavaScript habilitado para funcionar.
        </div>
    </noscript>
</body>
</html>

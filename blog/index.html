<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog no GitHub Pages</title>
    <style>
        :root { --primary: #0969da; --bg: #f6f8fa; --card: #ffffff; --border: #d0d7de; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #24292f; margin: 0; padding: 20px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 15px; }
        .meta { font-size: 0.85em; color: #57606a; margin-bottom: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9em; }
        .btn-secondary { background: #6e7781; }
        .btn-danger { background: #cf222e; }
        .btn:hover { opacity: 0.9; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0 16px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 150px; resize: vertical; }
        .hidden { display: none; }
        .actions { display: flex; gap: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><a href="#" onclick="showSection('public')" style="color:inherit; text-decoration:none;">Meu Blog GitHub</a></h1>
        <button id="authBtn" class="btn btn-secondary" onclick="toggleAdmin()">Área do Editor</button>
    </header>

    <!-- VISÃO PÚBLICA DE POSTS -->
    <section id="public-section">
        <div id="posts-list">Carregando matérias...</div>
    </section>

    <!-- PAINEL DE CONFIGURAÇÃO E EDIÇÃO (ADMIN) -->
    <section id="admin-section" class="hidden">
        <!-- Configuração de Credenciais da API -->
        <div class="card">
            <h3>⚙️ Configuração da API do GitHub</h3>
            <p style="font-size: 0.85em; color: #57606a;">
                Estas informações ficam salvas apenas no <strong>localStorage</strong> do seu navegador.
            </p>
            <label>Usuário no GitHub:</label>
            <input type="text" id="gh-owner" placeholder="Ex: seu-usuario">
            
            <label>Nome do Repositório:</label>
            <input type="text" id="gh-repo" placeholder="Ex: meu-blog">
            
            <label>GitHub Personal Access Token (PAT):</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
            
            <button class="btn" onclick="saveCredentials()">Salvar Configurações</button>
        </div>

        <!-- Formulário de Criar/Editar -->
        <div class="card">
            <h3 id="form-title">Nova Matéria</h3>
            <input type="hidden" id="post-id">
            
            <label>Título:</label>
            <input type="text" id="post-title">
            
            <label>Conteúdo:</label>
            <textarea id="post-content"></textarea>
            
            <div class="actions">
                <button class="btn" onclick="savePost()">Salvar Matéria</button>
                <button class="btn btn-secondary" onclick="clearForm()">Cancelar</button>
            </div>
        </div>

        <h3>Matérias Cadastradas</h3>
        <div id="admin-posts-list"></div>
    </section>
</div>

<script>
let currentPosts = [];

// Utilitários de codificação UTF-8 para Base64 (exigido pela API do GitHub)
function utf8_to_b64(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
}

// Carregar Configurações do LocalStorage
document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

function saveCredentials() {
    localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
    localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
    localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
    alert('Configurações salvas!');
}

// Alternar Seções
function showSection(section) {
    document.getElementById('public-section').classList.toggle('hidden', section !== 'public');
    document.getElementById('admin-section').classList.toggle('hidden', section !== 'admin');
}

function toggleAdmin() {
    const isHidden = document.getElementById('admin-section').classList.contains('hidden');
    if (isHidden) {
        showSection('admin');
        renderAdminPosts();
    } else {
        showSection('public');
    }
}

// Buscar Posts (Público)
async function fetchPosts() {
    try {
        const res = await fetch('./posts.json?v=' + Date.now());
        currentPosts = await res.json();
        renderPublicPosts();
    } catch (e) {
        document.getElementById('posts-list').innerHTML = '<p>Erro ao carregar matérias ou nenhuma matéria encontrada.</p>';
    }
}

function renderPublicPosts() {
    const container = document.getElementById('posts-list');
    if (currentPosts.length === 0) {
        container.innerHTML = '<p>Nenhuma matéria publicada.</p>';
        return;
    }
    
    container.innerHTML = currentPosts.map(post => `
        <article class="card">
            <h2>${escapeHtml(post.title)}</h2>
            <div class="meta">Publicado em: ${post.created_at}</div>
            <p>${escapeHtml(post.content).replace(/\n/g, '<br>')}</p>
        </article>
    `).join('');
}

function renderAdminPosts() {
    const container = document.getElementById('admin-posts-list');
    container.innerHTML = currentPosts.map(post => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <strong>${escapeHtml(post.title)}</strong>
                <div class="meta">${post.created_at}</div>
            </div>
            <div class="actions">
                <button class="btn" onclick="editPost('${post.id}')">Editar</button>
                <button class="btn btn-danger" onclick="deletePost('${post.id}')">Excluir</button>
            </div>
        </div>
    `).join('');
}

// Formulário
function editPost(id) {
    const post = currentPosts.find(p => p.id === id);
    if (!post) return;
    document.getElementById('post-id').value = post.id;
    document.getElementById('post-title').value = post.title;
    document.getElementById('post-content').value = post.content;
    document.getElementById('form-title').innerText = 'Editar Matéria';
}

function clearForm() {
    document.getElementById('post-id').value = '';
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    document.getElementById('form-title').innerText = 'Nova Matéria';
}

// Salvar / Editar via API do GitHub
async function savePost() {
    const owner = localStorage.getItem('gh_owner');
    const repo = localStorage.getItem('gh_repo');
    const token = localStorage.getItem('gh_token');

    if (!owner || !repo || !token) {
        alert('Por favor, configure o Usuário, Repositório e Token do GitHub primeiro!');
        return;
    }

    const id = document.getElementById('post-id').value;
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();

    if (!title || !content) {
        alert('Preencha título e conteúdo!');
        return;
    }

    let updatedPosts = [...currentPosts];

    if (id) {
        // Atualizar
        updatedPosts = updatedPosts.map(p => p.id === id ? { ...p, title, content, updated_at: new Date().toLocaleString() } : p);
    } else {
        // Criar Novo
        updatedPosts.unshift({
            id: Date.now().toString(),
            title,
            content,
            created_at: new Date().toLocaleString()
        });
    }

    await syncWithGitHub(owner, repo, token, updatedPosts, id ? 'Atualizando matéria' : 'Nova matéria');
}

async function deletePost(id) {
    if (!confirm('Deseja excluir esta matéria?')) return;
    const owner = localStorage.getItem('gh_owner');
    const repo = localStorage.getItem('gh_repo');
    const token = localStorage.getItem('gh_token');

    const updatedPosts = currentPosts.filter(p => p.id !== id);
    await syncWithGitHub(owner, repo, token, updatedPosts, 'Excluindo matéria');
}

// Enviar alteração de posts.json para o GitHub
async function syncWithGitHub(owner, repo, token, newPostsData, commitMessage) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/posts.json`;

    try {
        // 1. Obter o SHA do arquivo posts.json atual (obrigatório para atualização)
        const getRes = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const fileData = await getRes.json();
        const sha = fileData.sha;

        // 2. Fazer o PUT com os dados novos em Base64
        const contentB64 = utf8_to_b64(JSON.stringify(newPostsData, null, 2));

        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify({
                message: commitMessage,
                content: contentB64,
                sha: sha
            })
        });

        if (putRes.ok) {
            alert('Sucesso! O repositório foi atualizado.');
            clearForm();
            fetchPosts();
        } else {
            const err = await putRes.json();
            alert('Erro ao salvar no GitHub: ' + (err.message || 'Verifique o Token/Permissões'));
        }
    } catch (e) {
        alert('Erro de conexão com a API do GitHub.');
        console.error(e);
    }
}

function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
}

// Inicialização
fetchPosts();
</script>

</body>
</html>

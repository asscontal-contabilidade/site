<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorias — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"><script src="admin-auth.js"></script></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a href="index.html">▦ Dashboard</a><a href="editor.html">＋ Nova matéria</a><a class="active" href="categorias.html">☷ Categorias</a><a href="../" target="_blank">↗ Ver blog</a></nav><button type="button" id="logout">Sair</button></aside><main><div id="apiStatus" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando categorias...</div><div class="top"><div><small>CONFIGURAÇÕES DO BLOG</small><h1>Categorias</h1></div><button class="btn primary" id="save">Salvar alterações</button></div><section class="panel"><div class="panel-title"><div><h2>Categorias das matérias</h2><p class="hint">Adicione, renomeie ou exclua categorias. As alterações serão usadas no editor de matérias.</p></div></div><div class="category-form"><input id="newCat" placeholder="Nome da nova categoria"><button class="btn primary" id="add" type="button">＋ Adicionar</button></div><div id="list" class="category-list"></div></section></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',$=id=>document.getElementById(id);let cats=[];function msg(m,e=false){$('apiStatus').textContent=m;$('apiStatus').style.background=e?'#fee2e2':'#dcfce7';$('apiStatus').style.color=e?'#991b1b':'#166534'}async function call(path,opt={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+path,{...opt,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d}async function login(){return await adminAuthenticate()}function draw(){$('list').innerHTML=cats.map((c,i)=>`<div class="category-row"><input value="${String(c).replace(/"/g,'&quot;')}" data-i="${i}"><button class="btn small" type="button" onclick="renameCat(${i},this)">Atualizar</button><button class="btn small danger" type="button" onclick="removeCat(${i})">Excluir</button></div>`).join('')||'<p>Nenhuma categoria cadastrada.</p>'}window.renameCat=(i,b)=>{const v=b.parentElement.querySelector('input').value.trim();if(v){cats[i]=v;draw()}};window.removeCat=i=>{if(confirm('Excluir esta categoria? As matérias existentes não serão apagadas.')){cats.splice(i,1);draw()}};$('add').onclick=()=>{const v=$('newCat').value.trim();if(v&&!cats.some(x=>x.toLowerCase()===v.toLowerCase())){cats.push(v);$('newCat').value='';draw()}};$('newCat').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('add').click()}};$('save').onclick=async()=>{document.querySelectorAll('.category-row input').forEach((x,i)=>cats[i]=x.value.trim());cats=[...new Set(cats.filter(Boolean))];try{$('save').disabled=true;$('save').textContent='Salvando...';cats=await call('/categories',{method:'PUT',body:JSON.stringify(cats)});draw();msg('Categorias salvas no GitHub com sucesso!')}catch(e){msg(e.message,true)}finally{$('save').disabled=false;$('save').textContent='Salvar alterações'}};$('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.href='index.html'};(async()=>{try{if(!await login()){msg('Login cancelado.',true);return}cats=await call('/categories');adminUnlock();draw();msg('Categorias carregadas.')}catch(e){msg(e.message,true)}})();</script></body></html>

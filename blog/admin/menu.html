<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"><script src="admin-auth.js"></script></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a href="index.html">▦ Dashboard</a><a href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a class="active" href="menu.html">☰ Menu do blog</a><a href="../" target="_blank">↗ Ver blog</a></nav><button id="logout">Sair</button></aside><main><div id="apiStatus" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando menu...</div><div class="top"><div><small>CONFIGURAÇÕES DO BLOG</small><h1>Menu do blog</h1></div><button class="btn primary" id="save">Salvar menu</button></div><section class="panel"><div class="panel-title"><div><h2>Itens do cabeçalho</h2><p class="hint">Edite o texto e o endereço, ative/desative ou altere a ordem.</p></div></div><div class="category-form"><input id="newLabel" placeholder="Nome"><input id="newUrl" placeholder="Endereço, ex.: categoria.html?cat=Tributário"><button class="btn primary" id="add">＋ Adicionar</button></div><div id="list" class="category-list"></div></section></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',$=i=>document.getElementById(i);let items=[];function msg(m,e=false){$('apiStatus').textContent=m;$('apiStatus').style.background=e?'#fee2e2':'#dcfce7';$('apiStatus').style.color=e?'#991b1b':'#166534'}async function call(p,o={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro '+r.status);return d}async function login(){return await adminAuthenticate()}function sync(){document.querySelectorAll('.menu-row').forEach((r,i)=>{items[i].label=r.querySelector('.lbl').value.trim();items[i].url=r.querySelector('.url').value.trim();items[i].enabled=r.querySelector('.ena').checked})}function draw(){$('list').innerHTML=items.map((x,i)=>`<div class="category-row menu-row" style="grid-template-columns:1fr 1.5fr auto auto auto auto"><input class="lbl" value="${x.label.replace(/"/g,'&quot;')}"><input class="url" value="${x.url.replace(/"/g,'&quot;')}"><label><input class="ena" type="checkbox" ${x.enabled!==false?'checked':''}> Ativo</label><button class="btn small" onclick="move(${i},-1)">↑</button><button class="btn small" onclick="move(${i},1)">↓</button><button class="btn small danger" onclick="del(${i})">Excluir</button></div>`).join('')}window.move=(i,d)=>{sync();const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];draw()};window.del=i=>{sync();items.splice(i,1);draw()};$('add').onclick=()=>{const l=$('newLabel').value.trim(),u=$('newUrl').value.trim();if(l&&u){sync();items.push({label:l,url:u,enabled:true});$('newLabel').value='';$('newUrl').value='';draw()}};$('save').onclick=async()=>{try{sync();items=await call('/menu',{method:'PUT',body:JSON.stringify(items)});draw();msg('Menu salvo no GitHub com sucesso!')}catch(e){msg(e.message,true)}};$('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.href='index.html'};(async()=>{try{if(!await login())return;items=await call('/menu');adminUnlock();draw();msg('Menu carregado.')}catch(e){msg(e.message,true)}})();</script></body></html>

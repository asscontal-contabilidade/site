<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Configurações — Asscontal Blog</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="admin-auth.js"></script>
  </head>
  <body>
    <div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a href="./">▦ Dashboard</a><a href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a href="menu.html">☰ Menu do blog</a><a class="active" href="configuracoes.html">⚙ Configurações</a><a href="../" target="_blank">↗ Ver blog</a></nav></aside><main><div id="status" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando...</div><div class="top"><div><small>CONFIGURAÇÕES DO BLOG</small><h1>Conteúdo, identidade e SEO</h1></div><button class="btn primary" id="save">Salvar alterações</button></div><div id="uploads" class="panel" style="margin-bottom:22px"><h2>Arquivos da identidade visual</h2><p>Envie uma imagem e o endereço será preenchido automaticamente. Depois clique em <b>Salvar alterações</b>.</p><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px"><label><b>Logomarca</b><input type="file" id="logoFile" accept="image/*" style="display:block;margin:10px 0"><button class="btn" type="button" onclick="uploadVisual('logoFile','logoUrl')">Enviar logomarca</button></label><label><b>Favicon</b><input type="file" id="faviconFile" accept="image/*,.ico" style="display:block;margin:10px 0"><button class="btn" type="button" onclick="uploadVisual('faviconFile','faviconUrl')">Enviar favicon</button></label><label><b>Imagem padrão / compartilhamento</b><input type="file" id="defaultFile" accept="image/*" style="display:block;margin:10px 0"><button class="btn" type="button" onclick="uploadVisual('defaultFile','defaultImageUrl',true)">Enviar imagem</button></label></div></div><div id="fields"></div></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',s=document.getElementById('status');const groups=[['Identidade visual',[['logoUrl','Endereço da logomarca'],['faviconUrl','Endereço do favicon'],['defaultImageUrl','Imagem padrão das matérias'],['primaryColor','Cor principal','color'],['secondaryColor','Cor secundária','color'],['accentColor','Cor de destaque','color']]],['Cabeçalho do blog',[['headerBlogLabel','Nome do blog no cabeçalho'],['headerBlogTagline','Frase ou pequena descrição exibida ao lado da logomarca','textarea']]],['SEO e compartilhamento',[['seoTitle','Título do blog para Google'],['seoDescription','Descrição para Google e redes sociais','textarea'],['seoKeywords','Palavras-chave'],['seoSiteName','Nome do site'],['seoImageUrl','Imagem de compartilhamento']]],['Últimas matérias',[['latestEyebrow','Texto pequeno acima do título'],['latestTitle','Título da seção'],['latestButtonText','Texto do link'],['latestButtonUrl','Endereço do link']]],['Conteúdos em destaque',[['featuredEyebrow','Texto pequeno acima do título'],['featuredTitle','Título da seção']]],['Rodapé',[['footerTagline','Texto institucional','textarea'],['footerContentTitle','Título da coluna de conteúdo'],['footerCompanyTitle','Título da coluna da empresa']]],['Informações de contato',[['contactPhone','Telefone'],['contactWhatsApp','WhatsApp'],['contactEmail','E-mail'],['contactAddress','Endereço'],['contactInstagram','Instagram - endereço completo'],['contactLinkedIn','LinkedIn - endereço completo']]],['Chamada no final das matérias',[['articleCtaEyebrow','Texto pequeno'],['articleCtaTitle','Título'],['articleCtaText','Texto','textarea'],['articleCtaButtonText','Texto do botão'],['articleCtaButtonUrl','Endereço do botão']]]];function msg(t,e=false){s.textContent=t;s.style.background=e?'#fee2e2':'#dcfce7';s.style.color=e?'#991b1b':'#166534';scrollTo({top:0,behavior:'smooth'})}async function call(p,o={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro '+r.status);return d}async function login(){return await adminAuthenticate();}function input(f){if(f[2]==='textarea')return `<textarea id="${f[0]}" style="width:100%;margin-top:7px;padding:13px;min-height:85px"></textarea>`;if(f[2]==='color')return `<div style="display:flex;gap:8px;margin-top:7px"><input type="color" id="${f[0]}Color" style="width:55px;height:45px;padding:2px"><input id="${f[0]}" style="flex:1;padding:13px"></div>`;return `<input id="${f[0]}" style="width:100%;margin-top:7px;padding:13px">`}function build(){fields.innerHTML=groups.map(g=>`<section class="panel" style="margin-bottom:22px"><h2>${g[0]}</h2><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px">${g[1].map(f=>`<label style="${f[2]==='textarea'?'grid-column:1/-1':''}"><b>${f[1]}</b>${input(f)}</label>`).join('')}</div></section>`).join('');groups.forEach(g=>g[1].filter(f=>f[2]==='color').forEach(f=>{const t=document.getElementById(f[0]),c=document.getElementById(f[0]+'Color');c.oninput=()=>t.value=c.value;t.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(t.value))c.value=t.value}}))}function values(){const o={};groups.forEach(g=>g[1].forEach(f=>o[f[0]]=document.getElementById(f[0]).value.trim()));return o}async function uploadVisual(fileId,target,alsoSeo=false){try{const file=document.getElementById(fileId).files[0];if(!file)throw new Error('Escolha um arquivo primeiro.');msg('Enviando arquivo...');const data=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)}),u=await call('/upload',{method:'POST',body:JSON.stringify({name:file.name,data})});document.getElementById(target).value=u.path;if(alsoSeo)document.getElementById('seoImageUrl').value=u.path;msg('Arquivo enviado. Clique em Salvar alterações para aplicar.') }catch(e){msg(e.message,true)}}async function load(){build();try{if(!await login())return;const c=await call('/config');adminUnlock();groups.forEach(g=>g[1].forEach(f=>{const e=document.getElementById(f[0]);e.value=c[f[0]]||'';if(f[2]==='color'&&/^#[0-9a-f]{6}$/i.test(e.value))document.getElementById(f[0]+'Color').value=e.value}));msg('Configurações carregadas.')}catch(e){msg(e.message,true)}}save.onclick=async()=>{try{save.disabled=true;await call('/config',{method:'PUT',body:JSON.stringify(values())});msg('Configurações salvas. Aguarde o deploy automático do site.')}catch(e){msg(e.message,true)}finally{save.disabled=false}};load();</script></body></html>

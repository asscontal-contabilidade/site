<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a href="./">▦ Dashboard</a><a href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a href="menu.html">☰ Menu do blog</a><a class="active" href="configuracoes.html">⚙ Configurações</a><a href="../" target="_blank">↗ Ver blog</a></nav></aside><main><div id="status" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando...</div><div class="top"><div><small>CONFIGURAÇÕES DO BLOG</small><h1>Conteúdo e apresentação</h1></div><button class="btn primary" id="save">Salvar alterações</button></div><div id="fields"></div></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',s=document.getElementById('status');const groups=[['Bloco de apresentação',[['introTitle','Título'],['introText','Texto','textarea'],['introButtonText','Texto do botão'],['introButtonUrl','Endereço do botão']]],['Últimas matérias',[['latestEyebrow','Texto pequeno acima do título'],['latestTitle','Título da seção'],['latestButtonText','Texto do link'],['latestButtonUrl','Endereço do link']]],['Conteúdos em destaque',[['featuredEyebrow','Texto pequeno acima do título'],['featuredTitle','Título da seção']]],['Rodapé',[['footerTagline','Texto institucional','textarea'],['footerContentTitle','Título da coluna de conteúdo'],['footerCompanyTitle','Título da coluna da empresa']]],['Chamada no final das matérias',[['articleCtaEyebrow','Texto pequeno'],['articleCtaTitle','Título'],['articleCtaText','Texto','textarea'],['articleCtaButtonText','Texto do botão'],['articleCtaButtonUrl','Endereço do botão']]]];function msg(t,e=false){s.textContent=t;s.style.background=e?'#fee2e2':'#dcfce7';s.style.color=e?'#991b1b':'#166534'}async function call(p,o={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro '+r.status);return d}async function login(){if(sessionStorage.getItem(KEY))return true;const p=prompt('Senha do administrador:');if(!p)return false;const d=await call('/login',{method:'POST',body:JSON.stringify({password:p})});sessionStorage.setItem(KEY,d.token);return true}function build(){fields.innerHTML=groups.map(g=>`<section class="panel" style="margin-bottom:22px"><h2>${g[0]}</h2><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px">${g[1].map(f=>`<label style="${f[2]==='textarea'?'grid-column:1/-1':''}"><b>${f[1]}</b>${f[2]==='textarea'?`<textarea id="${f[0]}" style="width:100%;margin-top:7px;padding:13px;min-height:85px"></textarea>`:`<input id="${f[0]}" style="width:100%;margin-top:7px;padding:13px">`}</label>`).join('')}</div></section>`).join('')}function values(){const o={};groups.forEach(g=>g[1].forEach(f=>o[f[0]]=document.getElementById(f[0]).value.trim()));return o}async function load(){build();try{if(!await login())return;const c=await call('/config');groups.forEach(g=>g[1].forEach(f=>document.getElementById(f[0]).value=c[f[0]]||''));msg('Configurações carregadas.')}catch(e){msg(e.message,true)}}save.onclick=async()=>{try{save.disabled=true;await call('/config',{method:'PUT',body:JSON.stringify(values())});msg('Configurações salvas. Aguarde o deploy automático do site.')}catch(e){msg(e.message,true)}finally{save.disabled=false}};load();</script></body></html>

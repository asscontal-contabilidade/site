<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a href="index.html">▦ Dashboard</a><a class="active" href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a href="menu.html">☰ Menu do blog</a><a href="configuracoes.html">⚙ Configurações</a><a href="../" target="_blank">↗ Ver blog</a></nav></aside><main><div id="apiStatus" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando editor...</div><div class="top"><div><small>ASSCONTAL BLOG • EDITOR</small><h1 id="editorTitle">Nova matéria</h1></div><div><button class="btn" id="preview">Pré-visualizar</button><button class="btn primary" id="save">Publicar</button></div></div><form class="editor-grid" onsubmit="return false"><section class="panel"><label>Título<input id="title" required placeholder="Título da matéria"></label><label>URL amigável (slug)<input id="slug" placeholder="reforma-tributaria-o-que-muda"><small class="hint">Endereço: /blog/materia/<span id="slugPreview">...</span></small></label><label>Resumo<textarea id="summary" rows="3" placeholder="Resumo curto para os cards"></textarea></label><label>Conteúdo</label><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" data-cmd="formatBlock" data-value="h3">H3</button><button type="button" data-cmd="insertUnorderedList">• Lista</button><button type="button" data-cmd="insertOrderedList">1. Lista</button><button type="button" id="linkBtn">🔗 Link</button><button type="button" id="insertImage">🖼 Imagem</button><input id="bodyImageFile" type="file" accept="image/*" hidden></div><div id="content" class="rich" contenteditable="true"></div><div style="margin-top:25px;padding-top:20px;border-top:1px solid #e5e7eb"><h2>SEO da matéria</h2><p class="hint">Opcional. Se deixar vazio, usaremos título, resumo e capa da matéria.</p><label>Título SEO<input id="seoTitle" maxlength="70" placeholder="Título para Google e compartilhamento"></label><label>Meta description<textarea id="seoDescription" rows="3" maxlength="180" placeholder="Descrição para resultados de pesquisa"></textarea></label><label>Palavra-chave principal<input id="seoKeyword" placeholder="Ex.: reforma tributária"></label><label>Imagem social (URL)<input id="seoImage" placeholder="Deixe vazio para usar a capa"></label></div></section><aside class="side"><label>Categoria<select id="category"></select></label><label>Autor<input id="author" value="Redação Asscontal"></label><label>Imagem de capa</label><div class="upload"><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" src="../assets/img/placeholder.svg" alt=""></div><label>Tags<input id="tags" placeholder="contabilidade, empresas, impostos"></label><label>Status<select id="status"><option value="published">Publicado</option><option value="draft">Rascunho</option></select></label></aside></form></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',$=i=>document.getElementById(i),st=$('apiStatus');let post=null,id=new URLSearchParams(location.search).get('id'),coverFile=null;function msg(m,e=false){st.textContent=m;st.style.background=e?'#fee2e2':'#dcfce7';st.style.color=e?'#991b1b':'#166534'}function slugify(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)}async function call(p,o={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro '+r.status);return d}async function login(){if(sessionStorage.getItem(KEY))return true;const p=prompt('Senha do administrador:');if(!p)return false;const d=await call('/login',{method:'POST',body:JSON.stringify({password:p})});sessionStorage.setItem(KEY,d.token);return true}function dataUrl(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}async function upload(f){msg('Enviando imagem...');return call('/upload',{method:'POST',body:JSON.stringify({name:f.name,data:await dataUrl(f)})})}let slugTouched=false;$('title').addEventListener('input',()=>{if(!slugTouched){$('slug').value=slugify($('title').value);$('slugPreview').textContent=$('slug').value||'...'}});$('slug').addEventListener('input',()=>{slugTouched=true;$('slug').value=slugify($('slug').value);$('slugPreview').textContent=$('slug').value||'...'});document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>document.execCommand(b.dataset.cmd,false,b.dataset.value||null));$('linkBtn').onclick=()=>{const u=prompt('Endereço do link:');if(u)document.execCommand('createLink',false,u)};$('insertImage').onclick=()=>$('bodyImageFile').click();$('bodyImageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const r=await upload(f);document.execCommand('insertImage',false,r.path);msg('Imagem inserida.')}catch(x){msg(x.message,true)}e.target.value=''};$('coverFile').onchange=async e=>{coverFile=e.target.files[0]||null;if(coverFile)$('coverPreview').src=await dataUrl(coverFile)};$('preview').onclick=()=>{sessionStorage.setItem('preview',JSON.stringify({id:'preview',slug:$('slug').value,title:$('title').value,summary:$('summary').value,category:$('category').value,author:$('author').value,date:new Date().toISOString().slice(0,10),cover:$('coverPreview').src,content:$('content').innerHTML,seoTitle:$('seoTitle').value,seoDescription:$('seoDescription').value,seoKeyword:$('seoKeyword').value,seoImage:$('seoImage').value}));window.open('../materia.html?id=preview','_blank')};$('save').onclick=async()=>{if(!$('title').value.trim()){msg('Informe o título.',true);return}const b=$('save');b.disabled=true;b.textContent='Salvando...';try{let cover=post?.cover||'assets/img/placeholder.svg';if(coverFile)cover=(await upload(coverFile)).path;const x={title:$('title').value.trim(),slug:slugify($('slug').value||$('title').value),summary:$('summary').value.trim(),category:$('category').value,author:$('author').value.trim()||'Redação Asscontal',date:post?.date||new Date().toISOString().slice(0,10),status:$('status').value,cover,tags:$('tags').value.split(',').map(v=>v.trim()).filter(Boolean),content:$('content').innerHTML,seoTitle:$('seoTitle').value.trim(),seoDescription:$('seoDescription').value.trim(),seoKeyword:$('seoKeyword').value.trim(),seoImage:$('seoImage').value.trim()};if(id)await call('/posts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(x)});else await call('/posts',{method:'POST',body:JSON.stringify(x)});msg('Matéria salva com sucesso!');setTimeout(()=>location.href='index.html',800)}catch(e){msg(e.message,true)}finally{b.disabled=false;b.textContent='Publicar'}};(async()=>{try{if(!await login())return;const [posts,cats]=await Promise.all([call('/posts'),call('/categories')]);post=posts.find(x=>String(x.id)===String(id));const sel=post?.category||cats[0]||'Geral';$('category').innerHTML=[...new Set([...cats,sel])].map(c=>`<option${c===sel?' selected':''}>${c}</option>`).join('');if(post){$('editorTitle').textContent='Editar matéria';$('title').value=post.title||'';$('slug').value=post.slug||slugify(post.title);$('slugPreview').textContent=$('slug').value;slugTouched=true;$('summary').value=post.summary||'';$('author').value=post.author||'Redação Asscontal';$('tags').value=(post.tags||[]).join(', ');$('status').value=post.status||'draft';$('content').innerHTML=post.content||'';$('coverPreview').src='../'+(post.cover||'assets/img/placeholder.svg');$('seoTitle').value=post.seoTitle||'';$('seoDescription').value=post.seoDescription||'';$('seoKeyword').value=post.seoKeyword||'';$('seoImage').value=post.seoImage||''}msg('CMS conectado ao GitHub.')}catch(e){msg(e.message,true)}})();</script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor — Portal</title><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body><div class="admin-layout">
<aside><div class="admin-logo">P<span>PORTAL ADMIN</span></div><nav><a href="index.html">▦ Dashboard</a><a class="active" href="editor.html">＋ Nova matéria</a><a href="../" target="_blank">↗ Ver site</a></nav></aside>
<main><div class="top"><div><small>EDITOR DE MATÉRIAS</small><h1 id="editorTitle">Nova matéria</h1></div><div><button type="button" class="btn" id="preview">Pré-visualizar</button><button type="button" class="btn primary" id="save">Publicar</button></div></div>
<form id="form" class="editor-grid" onsubmit="return false;"><section class="panel">
<label>Título<input id="title" required placeholder="Título da matéria"></label><label>Resumo<textarea id="summary" rows="3" placeholder="Resumo curto para aparecer nos cards"></textarea></label>
<label>Conteúdo</label><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" data-cmd="formatBlock" data-value="blockquote">❝</button><button type="button" id="insertImage">🖼 Imagem</button></div><div id="content" class="rich" contenteditable="true" data-placeholder="Escreva sua matéria aqui..."></div></section>
<aside class="side"><label>Categoria<select id="category"><option>Política</option><option>Economia</option><option>Tecnologia</option><option>Cidades</option><option>Esportes</option><option>Cultura</option><option>Geral</option></select></label><label>Autor<input id="author" value="Redação"></label><label>Imagem de capa</label><div class="upload"><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" alt=""></div><label>Tags<input id="tags" placeholder="notícia, destaque, brasil"></label><label>Status<select id="status"><option value="published">Publicado</option><option value="draft">Rascunho</option></select></label></aside></form></main></div><script src="../assets/js/config.js?v=3"></script><script src="../assets/js/admin.js?v=3"></script><script>initEditor();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a href="index.html">▦ Dashboard</a><a class="active" href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a href="../" target="_blank">↗ Ver blog</a></nav></aside><main><div id="apiStatus" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando editor...</div><div class="top"><div><small>ASSCONTAL BLOG • EDITOR</small><h1 id="editorTitle">Nova matéria</h1></div><div><button type="button" class="btn" id="preview">Pré-visualizar</button><button type="button" class="btn primary" id="save">Publicar</button></div></div><form class="editor-grid" onsubmit="return false"><section class="panel"><label>Título<input id="title" required placeholder="Título da matéria"></label><label>Resumo<textarea id="summary" rows="3" placeholder="Resumo curto para aparecer nos cards"></textarea></label><label>Conteúdo</label><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="formatBlock" data-value="h2">H2</button><button type="button" data-cmd="formatBlock" data-value="blockquote">❝</button><button type="button" id="insertImage">🖼 Imagem</button></div><div id="content" class="rich" contenteditable="true" data-placeholder="Escreva sua matéria aqui..."></div></section><aside class="side"><label>Categoria<select id="category"><option>Carregando...</option></select></label><label>Autor<input id="author" value="Redação Asscontal"></label><label>Imagem de capa</label><div class="upload"><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" src="../assets/img/placeholder.svg" alt=""></div><label>Tags<input id="tags" placeholder="contabilidade, empresas, impostos"></label><label>Status<select id="status"><option value="published">Publicado</option><option value="draft">Rascunho</option></select></label></aside></form></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',$=id=>document.getElementById(id),st=$('apiStatus');let post=null,id=new URLSearchParams(location.search).get('id');function msg(m,e=false){st.textContent=m;st.style.background=e?'#fee2e2':'#dcfce7';st.style.color=e?'#991b1b':'#166534'}async function call(path,opt={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+path,{...opt,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erro '+r.status));return d}async function login(){if(sessionStorage.getItem(KEY))return true;const p=prompt('Senha do administrador:');if(!p)return false;const d=await call('/login',{method:'POST',body:JSON.stringify({password:p})});sessionStorage.setItem(KEY,d.token);return true}function dataUrl(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>document.execCommand(b.dataset.cmd,false,b.dataset.value||null));$('insertImage').onclick=()=>{const u=prompt('URL da imagem:');if(u)document.execCommand('insertImage',false,u)};$('coverFile').onchange=async e=>{if(e.target.files[0])$('coverPreview').src=await dataUrl(e.target.files[0])};$('preview').onclick=()=>{const x={id:'preview',title:$('title').value,summary:$('summary').value,category:$('category').value,author:$('author').value,date:new Date().toISOString().slice(0,10),cover:$('coverPreview').src,content:$('content').innerHTML};sessionStorage.setItem('preview',JSON.stringify(x));window.open('../materia.html?id=preview','_blank')};$('save').onclick=async()=>{const x={title:$('title').value.trim(),summary:$('summary').value.trim(),category:$('category').value,author:$('author').value.trim()||'Redação Asscontal',date:post&&post.date?post.date:new Date().toISOString().slice(0,10),status:$('status').value,cover:$('coverPreview').src,tags:$('tags').value.split(',').map(v=>v.trim()).filter(Boolean),content:$('content').innerHTML};if(!x.title){msg('Informe o título.',true);return}const b=$('save');b.disabled=true;b.textContent='Salvando...';try{if(id)await call('/posts/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(x)});else await call('/posts',{method:'POST',body:JSON.stringify(x)});msg('Matéria salva no GitHub com sucesso!');setTimeout(()=>location.href='index.html',800)}catch(e){msg(e.message,true)}finally{b.disabled=false;b.textContent='Publicar'}};(async()=>{try{if(!await login()){msg('Login cancelado.',true);return}const [posts,cats]=await Promise.all([call('/posts'),call('/categories')]);post=posts.find(x=>String(x.id)===String(id));const selected=post?.category||cats[0]||'Geral';$('category').innerHTML=[...new Set([...cats,selected])].map(c=>`<option${c===selected?' selected':''}>${c}</option>`).join('');if(post){$('editorTitle').textContent='Editar matéria';$('title').value=post.title||'';$('summary').value=post.summary||'';$('author').value=post.author||'Redação Asscontal';$('tags').value=(post.tags||[]).join(', ');$('status').value=post.status||'draft';$('content').innerHTML=post.content||'';$('coverPreview').src=post.cover||'../assets/img/placeholder.svg'}msg('CMS conectado ao GitHub.')}catch(e){msg(e.message,true)}})();</script></body></html>

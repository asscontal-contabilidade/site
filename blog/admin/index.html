<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a class="active" href="./">▦ Dashboard</a><a href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a href="menu.html">☰ Menu do blog</a><a href="configuracoes.html">⚙ Configurações</a><a href="../" target="_blank">↗ Ver blog</a></nav><button type="button" id="logout">Sair</button></aside><main><div id="apiStatus" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando painel...</div><div class="top"><div><small>ASSCONTAL BLOG</small><h1>Dashboard</h1></div><a class="btn primary" href="editor.html">＋ Nova matéria</a></div><div class="stats"><div><b id="total">0</b><span>Matérias</span></div><div><b id="published">0</b><span>Publicadas</span></div><div><b id="drafts">0</b><span>Rascunhos</span></div></div><section class="panel"><div class="panel-title"><h2>Matérias</h2><input id="filter" placeholder="Filtrar matérias..."></div><div class="table-wrap"><table><thead><tr><th>Matéria</th><th>Categoria</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody id="table"></tbody></table></div></section></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',st=document.getElementById('apiStatus');function status(m,e=false){st.textContent=m;st.style.background=e?'#fee2e2':'#dcfce7';st.style.color=e?'#991b1b':'#166534'}async function call(p,o={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro '+r.status);return d}async function login(){if(sessionStorage.getItem(KEY))return true;const p=prompt('Senha do administrador:');if(!p)return false;const d=await call('/login',{method:'POST',body:JSON.stringify({password:p})});sessionStorage.setItem(KEY,d.token);return true}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){try{if(!await login())return;const p=await call('/posts');status('CMS conectado ao GitHub.');total.textContent=p.length;published.textContent=p.filter(x=>x.status==='published').length;drafts.textContent=p.filter(x=>x.status==='draft').length;const draw=()=>{const q=filter.value.toLowerCase();table.innerHTML=p.filter(x=>(x.title||'').toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.category)}</td><td>${x.status==='published'?'Publicado':'Rascunho'}</td><td>${x.date||''}</td><td><a class="btn small" href="editor.html?id=${encodeURIComponent(x.id)}">Editar</a> <button class="btn small danger" onclick="removePost('${x.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhuma matéria.</td></tr>'};filter.oninput=draw;draw()}catch(e){status(e.message,true)}}window.removePost=async id=>{if(!confirm('Excluir esta matéria?'))return;try{await call('/posts/'+encodeURIComponent(id),{method:'DELETE'});location.reload()}catch(e){status(e.message,true)}};logout.onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};load();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Asscontal Blog</title><link rel="stylesheet" href="../assets/css/admin.css"></head><body><div class="admin-layout"><aside><div class="admin-logo"><img src="../../images/logo-2019-190x105.png" alt="Asscontal"></div><nav><a class="active" href="./">▦ Dashboard</a><a href="editor.html">＋ Nova matéria</a><a href="categorias.html">☷ Categorias</a><a href="menu.html">☰ Menu do blog</a><a href="configuracoes.html">⚙ Configurações</a><a href="../" target="_blank">↗ Ver blog</a></nav><button type="button" id="logout">Sair</button></aside><main><div id="apiStatus" style="margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#eef2ff;color:#1e3a8a;font-weight:700">Carregando painel...</div><div class="top"><div><small>ASSCONTAL BLOG</small><h1>Dashboard</h1></div><a class="btn primary" href="editor.html">＋ Nova matéria</a></div><div class="stats" style="grid-template-columns:repeat(4,1fr)"><div><b id="total">0</b><span>Matérias</span></div><div><b id="published">0</b><span>Publicadas</span></div><div><b id="drafts">0</b><span>Rascunhos</span></div><div><b id="categoriesCount">0</b><span>Categorias</span></div></div><div style="display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-bottom:25px"><section class="panel"><div class="panel-title"><h2>Últimas publicações</h2></div><div id="recent"></div></section><section class="panel"><div class="panel-title"><h2>Por categoria</h2></div><div id="byCategory"></div></section></div><section class="panel"><div class="panel-title"><h2>Matérias</h2><input id="filter" placeholder="Filtrar matérias..."></div><div class="table-wrap"><table><thead><tr><th>Matéria</th><th>Categoria</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody id="table"></tbody></table></div></section></main></div><script>const API='https://asscontal-blog-cms.asscontal.workers.dev',KEY='blog_admin_token',st=document.getElementById('apiStatus');function status(m,e=false){st.textContent=m;st.style.background=e?'#fee2e2':'#dcfce7';st.style.color=e?'#991b1b':'#166534'}async function call(p,o={}){const h={'content-type':'application/json'},t=sessionStorage.getItem(KEY);if(t)h.authorization='Bearer '+t;const r=await fetch(API+p,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro '+r.status);return d}async function login(){if(sessionStorage.getItem(KEY))return true;const p=prompt('Senha do administrador:');if(!p)return false;const d=await call('/login',{method:'POST',body:JSON.stringify({password:p})});sessionStorage.setItem(KEY,d.token);return true}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function drawRecent(p){const a=[...p].filter(x=>x.status==='published').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);recent.innerHTML=a.length?a.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #edf0f3"><a href="editor.html?id=${encodeURIComponent(x.id)}"><b>${esc(x.title)}</b></a><div style="font-size:12px;color:#718096">${esc(x.category||'')} · ${x.date||''}</div></div>`).join(''):'<p>Nenhuma matéria publicada.</p>'}function drawCategories(p,cats){const counts={};p.forEach(x=>{const c=x.category||'Sem categoria';counts[c]=(counts[c]||0)+1});const names=[...new Set([...(cats||[]),...Object.keys(counts)])];byCategory.innerHTML=names.length?names.map(c=>{const n=counts[c]||0;const pct=p.length?Math.round(n/p.length*100):0;return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:12px"><b>${esc(c)}</b><span>${n}</span></div><div style="height:8px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:6px"><div style="height:100%;width:${pct}%;background:#0077b6"></div></div></div>`}).join(''):'<p>Nenhuma categoria.</p>'}async function load(){try{if(!await login())return;const [p,cats]=await Promise.all([call('/posts'),call('/categories')]);status('CMS conectado ao GitHub.');total.textContent=p.length;published.textContent=p.filter(x=>x.status==='published').length;drafts.textContent=p.filter(x=>x.status==='draft').length;categoriesCount.textContent=cats.length;drawRecent(p);drawCategories(p,cats);const draw=()=>{const q=filter.value.toLowerCase();table.innerHTML=p.filter(x=>(x.title||'').toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.category)}</td><td>${x.status==='published'?'Publicado':'Rascunho'}</td><td>${x.date||''}</td><td><a class="btn small" href="editor.html?id=${encodeURIComponent(x.id)}">Editar</a> <button class="btn small danger" onclick="removePost('${x.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhuma matéria.</td></tr>'};filter.oninput=draw;draw()}catch(e){status(e.message,true)}}window.removePost=async id=>{if(!confirm('Excluir esta matéria?'))return;try{await call('/posts/'+encodeURIComponent(id),{method:'DELETE'});location.reload()}catch(e){status(e.message,true)}};logout.onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};load();</script><style>@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)!important}main>div[style*="grid-template-columns:1.1fr"]{grid-template-columns:1fr!important}}</style></body></html>

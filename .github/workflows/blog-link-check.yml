name: Blog link check

on:
  workflow_dispatch:
  push:
    paths:
      - 'blog/data/materias.json'
      - 'blog/tools/check-links.mjs'
      - '.github/workflows/blog-link-check.yml'
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: write

concurrency:
  group: blog-link-check
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check links
        run: node blog/tools/check-links.mjs

      - name: Save report
        run: |
          if git diff --quiet -- blog/data/link-check.json; then
            echo "Relatório sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/data/link-check.json
          git commit -m "blog: atualiza relatório de links"
          git push
